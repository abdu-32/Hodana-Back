openapi: 3.0.3
info:
  title: Ethiopia Innovation Hub API
  version: 1.0.0
  description: Hackathon and innovation-challenge platform API.
paths:
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: POST /auth/login -- FR-AUTH-002.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: v1_auth_password_reset_create
      description: POST /auth/password-reset -- FR-AUTH-004. Not yet in Doc 04; add
        it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: |-
        POST /auth/password-reset/confirm -- FR-AUTH-004. Not yet in Doc 04;
        add it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /auth/refresh -- FR-AUTH-002. Replaces SimpleJWT's stock
        TokenRefreshView: that view neither matches the contract's response
        shape nor checks token_version on the refresh token itself (see
        services.refresh_access_token's docstring).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/signup:
    post:
      operationId: v1_auth_signup_create
      description: POST /auth/signup -- FR-AUTH-001.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/verify-email:
    post:
      operationId: v1_auth_verify_email_create
      description: POST /auth/verify-email -- FR-AUTH-003. Not yet in Doc 04; add
        it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/verify-email/resend:
    post:
      operationId: v1_auth_verify_email_resend_create
      description: |-
        POST /auth/verify-email/resend -- FR-AUTH-003 (1 request / 5 min).
        Not yet in Doc 04; add it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerification'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/organizations/:
    post:
      operationId: v1_organizations_create
      description: |-
        POST /organizations -- FR-ORG-001. Not yet in Doc 04; add it.
        No GET/list here -- there's no FR calling for a public org directory,
        only lookup-by-id (below) for badge display on pages that reference one.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterOrganization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterOrganization'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/organizations/{id}:
    get:
      operationId: v1_organizations_retrieve
      description: |-
        GET /organizations/{id} -- not tied to a single FR by number, but
        required for the "Verified badge on every public page referencing
        them" acceptance criterion in FR-ORG-002. Not yet in Doc 04; add it.
        Public (AllowAny): the badge is meant to be visible to anonymous
        visitors browsing hackathons/orgs, same reasoning as
        accounts.UserPublicProfileView.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/organizations/{id}/verification-documents:
    post:
      operationId: v1_organizations_verification_documents_create
      description: |-
        POST /organizations/{id}/verification-documents -- FR-ORG-003.
        Not yet in Doc 04; add it. Restricted to an Organizer scoped to this
        org (HasScopedRole checks apps.accounts.RoleAssignment, never a token
        claim, per Design Spec Sec 4.3); services.py re-checks the same thing
        for defense-in-depth, matching the pattern already used for
        is_platform_admin checks elsewhere in this codebase.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitVerificationDocuments'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitVerificationDocuments'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitVerificationDocuments'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgVerificationDocument'
          description: ''
  /api/v1/organizations/{id}/verification-review:
    post:
      operationId: v1_organizations_verification_review_create
      description: |-
        POST /organizations/{id}/verification-review -- FR-ORG-003. Not yet
        in Doc 04; add it. This is the FR-ADMIN-001 dashboard's decision
        action; it lives here (not in platform_admin) because the service
        function it drives, services.review_organization_verification, is
        itself owned by this app, same reasoning as accounts owning both the
        Auth and Users tags.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewOrganizationVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewOrganizationVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewOrganizationVerification'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgVerificationReview'
          description: ''
  /api/v1/users/{id}:
    get:
      operationId: v1_users_retrieve
      description: |-
        GET /users/{id} -- FR-PROFILE-002: "reachable without
        authentication". Doc 04 doesn't mark this operation `security: []`
        the way it does for /auth/* -- treating the FR as authoritative and
        flagging the contract as needing that override added.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: ''
  /api/v1/users/me:
    get:
      operationId: v1_users_me_retrieve
      description: |-
        GET/PUT /users/me -- FR-PROFILE-001. No explicit permission_classes:
        the project default (IsAuthenticated) already gives an unauthenticated
        request a 401 with no extra code needed here.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: v1_users_me_update
      description: |-
        GET/PUT /users/me -- FR-PROFILE-001. No explicit permission_classes:
        the project default (IsAuthenticated) already gives an unauthenticated
        request a 401 with no extra code needed here.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      description: |-
        Output-only wrapper for signup/login/refresh -- Doc 04 AuthResponse.
        `instance` is expected to be a plain dict: {"access", "refresh", "user"}.
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
      - accessToken
      - refreshToken
      - user
    Badge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        type:
          $ref: '#/components/schemas/BadgeTypeEnum'
        awardedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - awardedAt
      - id
      - type
      - userId
    BadgeTypeEnum:
      enum:
      - verified_student
      - hackathon_veteran
      type: string
      description: |-
        * `verified_student` - Verified Student
        * `hackathon_veteran` - Hackathon Veteran
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    NullEnum:
      enum:
      - null
    OauthProviderEnum:
      enum:
      - github
      type: string
      description: '* `github` - github'
    OrgVerificationDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organizationId:
          type: string
          format: uuid
          readOnly: true
        fileUrl:
          type: string
          readOnly: true
        uploadedByUserId:
          type: string
          format: uuid
          readOnly: true
        uploadedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - fileUrl
      - id
      - organizationId
      - uploadedAt
      - uploadedByUserId
    OrgVerificationReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organizationId:
          type: string
          format: uuid
          readOnly: true
        reviewedByUserId:
          type: string
          format: uuid
          readOnly: true
        decision:
          $ref: '#/components/schemas/OrgVerificationReviewDecisionEnum'
        rejectionReason:
          type: string
          readOnly: true
        reviewedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - decision
      - id
      - organizationId
      - rejectionReason
      - reviewedAt
      - reviewedByUserId
    OrgVerificationReviewDecisionEnum:
      enum:
      - approved
      - rejected
      type: string
      description: |-
        * `approved` - Approved
        * `rejected` - Rejected
    Organization:
      type: object
      description: |-
        Doc 04's `Organization` schema only declares id/name/type/contactEmail
        -- missing primaryEmailDomain, verificationStatus, and verifiedAt, all of
        which are load-bearing here (FR-ORG-002's "Verified badge on every public
        page" is meaningless without exposing verification_status). Flagging as
        a contract gap to add to Doc 04/contracts/openapi.yaml rather than
        silently under-serializing to match the stale contract.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/OrganizationTypeEnum'
        contactEmail:
          type: string
          format: email
          readOnly: true
        primaryEmailDomain:
          type: string
          readOnly: true
          nullable: true
        verificationStatus:
          type: string
          readOnly: true
        verifiedAt:
          type: string
          format: date-time
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - contactEmail
      - createdAt
      - id
      - name
      - primaryEmailDomain
      - type
      - verificationStatus
      - verifiedAt
    OrganizationTypeEnum:
      enum:
      - university
      - company
      - ngo
      - government
      type: string
      description: |-
        * `university` - University
        * `company` - Company
        * `ngo` - NGO
        * `government` - Government
    PasswordResetConfirm:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          writeOnly: true
      required:
      - newPassword
      - token
    PasswordResetRequest:
      type: object
      description: |-
        Not yet in Doc 04 -- FR-AUTH-004 needs an endpoint; add
        POST /auth/password-reset to the contract to match.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetRequestResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    PublicProfile:
      type: object
      description: |-
        Doc 04 PublicProfile -- FR-PROFILE-002. Deliberately excludes email
        and phone (never rendered publicly, per the FR's acceptance criteria).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fullName:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        university:
          type: string
          readOnly: true
        skills:
          type: array
          items:
            type: string
          readOnly: true
        avatarUrl:
          type: string
          readOnly: true
        portfolioUrl:
          type: string
          readOnly: true
        badges:
          type: array
          items:
            $ref: '#/components/schemas/Badge'
          readOnly: true
      required:
      - avatarUrl
      - badges
      - bio
      - fullName
      - id
      - portfolioUrl
      - skills
      - university
    Refresh:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    RegisterOrganization:
      type: object
      description: POST /organizations request body -- FR-ORG-001.
      properties:
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/RegisterOrganizationTypeEnum'
        contactEmail:
          type: string
          format: email
        primaryEmailDomain:
          type: string
          nullable: true
      required:
      - contactEmail
      - name
      - type
    RegisterOrganizationTypeEnum:
      enum:
      - university
      - company
      - ngo
      - government
      type: string
      description: |-
        * `university` - university
        * `company` - company
        * `ngo` - ngo
        * `government` - government
    ResendVerification:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ReviewOrganizationVerification:
      type: object
      description: |-
        POST /organizations/{id}/verification-review -- FR-ORG-003.
        Not yet in Doc 04; add it there.
      properties:
        decision:
          $ref: '#/components/schemas/ReviewOrganizationVerificationDecisionEnum'
        rejectionReason:
          type: string
          nullable: true
      required:
      - decision
    ReviewOrganizationVerificationDecisionEnum:
      enum:
      - approved
      - rejected
      type: string
      description: |-
        * `approved` - approved
        * `rejected` - rejected
    Signup:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        fullName:
          type: string
          default: ''
          maxLength: 255
        oauthProvider:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OauthProviderEnum'
          - $ref: '#/components/schemas/NullEnum'
        oauthToken:
          type: string
      required:
      - email
      - password
    SubmitVerificationDocuments:
      type: object
      description: |-
        POST /organizations/{id}/verification-documents -- FR-ORG-003.
        Not yet in Doc 04; add it there. `fileUrls` are object-storage pointers
        already uploaded direct-to-storage (Design Spec Sec 6.3/ADR-005), not
        raw file bytes -- this endpoint just records them.
      properties:
        fileUrls:
          type: array
          items:
            type: string
          maxItems: 3
          minItems: 1
      required:
      - fileUrls
    UserProfile:
      type: object
      description: |-
        Maps to Doc 04's UserProfile -- used for /users/me and nested in
        AuthResponse. Read-only: writes go through UserUpdateSerializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        fullName:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        university:
          type: string
          readOnly: true
        skills:
          type: array
          items:
            type: string
          readOnly: true
        avatarUrl:
          type: string
          readOnly: true
        portfolioUrl:
          type: string
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
        verificationStatus:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatarUrl
      - bio
      - createdAt
      - email
      - fullName
      - id
      - portfolioUrl
      - roles
      - skills
      - university
      - verificationStatus
    UserUpdate:
      type: object
      description: |-
        Doc 04 UserUpdateRequest, plus portfolioUrl (see module docstring).
        `validated_data` comes out snake_case, matching
        services.PROFILE_UPDATE_FIELDS exactly, so a view can pass it straight
        through to services.update_profile(account=..., data=serializer.validated_data).
      properties:
        fullName:
          type: string
          maxLength: 255
        bio:
          type: string
          maxLength: 500
        university:
          type: string
          maxLength: 255
        skills:
          type: array
          items:
            type: string
            maxLength: 100
        avatarUrl:
          type: string
        portfolioUrl:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        contactEmail:
          type: string
          format: email
          nullable: true
    VerifyEmail:
      type: object
      description: |-
        Not yet in Doc 04 -- FR-AUTH-003 needs an endpoint; add
        POST /auth/verify-email to the contract to match.
      properties:
        token:
          type: string
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
