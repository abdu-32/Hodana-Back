openapi: 3.0.3
info:
  title: Ethiopia Innovation Hub API
  version: 0.1.0
  description: API contract for the Ethiopia Innovation Hub hackathon platform (discover, register, form teams, submit, judge, and showcase).
servers:
- url: https://api.hub.et.example/api/v1
tags:
- name: Health
  description: Service health and readiness checks.
- name: Auth
  description: Signup, login, and token refresh flows.
- name: Users
  description: User account and public profile management.
- name: Hackathons
  description: Hackathon creation, discovery, and registration.
- name: Tracks
  description: Sponsor challenge tracks within a hackathon.
- name: Teams
  description: Team formation and membership.
- name: Submissions
  description: Project submissions, eligibility, and track assignment.
- name: Judging
  description: Judging rounds, criteria, invitations, and scores.
- name: Analytics
  description: Organizer analytics and reporting.
- name: Notifications
  description: Announcements and reminders.
- name: Search
  description: Search for users and mentors.
- name: Payments
  description: Prize disbursement via local payment gateways.
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      security: []
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/signup:
    post:
      tags:
      - Auth
      security: []
      operationId: signup
      summary: Create a new user (email/password or OAuth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
      - Auth
      security: []
      operationId: login
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/verify-email:
    post:
      tags:
      - Auth
      security: []
      operationId: verifyEmail
      summary: Confirm a verification link and activate the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/verify-email/resend:
    post:
      tags:
      - Auth
      security: []
      operationId: resendVerificationEmail
      summary: Request a new verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/password-reset:
    post:
      tags:
      - Auth
      security: []
      operationId: requestPasswordReset
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/password-reset/confirm:
    post:
      tags:
      - Auth
      security: []
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/me:
    get:
      tags:
      - Users
      operationId: getCurrentUser
      summary: View current user's own profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Users
      operationId: updateCurrentUser
      summary: Update current user's own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}:
    get:
      tags:
      - Users
      security: []
      operationId: getUserById
      summary: View another user's public profile
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /hackathons:
    get:
      tags:
      - Hackathons
      security: []
      operationId: listHackathons
      summary: List hackathons (filterable by keyword, date range, tags)
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: keyword
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - online
          - in_person
          - hybrid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - published
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHackathons'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Hackathons
      operationId: createHackathon
      summary: Create a hackathon (organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HackathonCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hackathons/{id}:
    get:
      tags:
      - Hackathons
      security: []
      operationId: getHackathonById
      summary: Get a hackathon
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      tags:
      - Hackathons
      operationId: updateHackathon
      summary: Update a hackathon (organizer only)
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HackathonUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Hackathons
      operationId: deleteHackathon
      summary: Delete a hackathon (organizer only)
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /hackathons/{id}/register:
    post:
      tags:
      - Hackathons
      operationId: registerForHackathon
      summary: Register current user for a hackathon
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreateRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /hackathons/{id}/tracks:
    get:
      tags:
      - Tracks
      security: []
      operationId: listChallengeTracks
      summary: List challenge tracks for a hackathon
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChallengeTracks'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Tracks
      operationId: createChallengeTrack
      summary: Create a sponsor challenge track (organizer/sponsor)
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeTrackCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeTrack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hackathons/{id}/teams:
    get:
      tags:
      - Teams
      operationId: listTeams
      summary: List teams for a hackathon
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: openToMembers
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeams'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Teams
      operationId: createTeam
      summary: Create a new team
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /teams/{id}:
    get:
      tags:
      - Teams
      operationId: getTeamById
      summary: Get a team
      parameters:
      - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Teams
      operationId: updateTeam
      summary: Update a team (leader only)
      parameters:
      - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Teams
      operationId: disbandTeam
      summary: Disband a team (leader only)
      parameters:
      - $ref: '#/components/parameters/TeamId'
      responses:
        '204':
          description: Disbanded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams/{id}/members:
    post:
      tags:
      - Teams
      operationId: inviteOrJoinTeam
      summary: Invite a member, or request to join an open team
      parameters:
      - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /hackathons/{id}/submissions:
    get:
      tags:
      - Submissions
      operationId: listSubmissions
      summary: List submissions for a hackathon
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: trackId
        in: query
        schema:
          type: string
          format: uuid
      - name: eligibilityStatus
        in: query
        schema:
          type: string
          enum:
          - pending
          - eligible
          - disqualified
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissions'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Submissions
      operationId: createSubmission
      summary: Create a project submission
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /submissions/{id}:
    get:
      tags:
      - Submissions
      operationId: getSubmissionById
      summary: Get a submission
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Submissions
      operationId: updateSubmission
      summary: Edit a submission (before deadline)
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{id}/eligibility:
    put:
      tags:
      - Submissions
      operationId: setSubmissionEligibility
      summary: Mark a submission eligible or disqualified (organizer only)
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{id}/tracks:
    post:
      tags:
      - Submissions
      operationId: assignSubmissionTrack
      summary: Assign a submission to a challenge track
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionTrackRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionTrack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Submissions
      operationId: removeSubmissionTrack
      summary: Remove a submission's challenge track assignment
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionTrackRequest'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rounds:
    get:
      tags:
      - Judging
      operationId: listJudgingRounds
      summary: List judging rounds (Overall or per-track)
      parameters:
      - name: hackathonId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: trackId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJudgingRounds'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Judging
      operationId: createJudgingRound
      summary: Create a judging round (organizer/sponsor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgingRoundCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgingRound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rounds/{id}/criteria:
    get:
      tags:
      - Judging
      operationId: listJudgingCriteria
      summary: Get the scoring rubric for a round
      parameters:
      - $ref: '#/components/parameters/RoundId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJudgingCriteria'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Judging
      operationId: createJudgingCriterion
      summary: Define a scoring criterion for a round (organizer/sponsor)
      parameters:
      - $ref: '#/components/parameters/RoundId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgingCriterionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgingCriterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /submissions/{id}/scores:
    get:
      tags:
      - Judging
      operationId: listSubmissionScores
      summary: Get all judges' scores for a submission
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScores'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{id}/score:
    post:
      tags:
      - Judging
      operationId: submitScore
      summary: Submit a judge's score for a criterion
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /judge/invitations:
    post:
      tags:
      - Judging
      operationId: inviteJudge
      summary: Invite a judge by email (organizer/sponsor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgeInvitationCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hackathons/{id}/analytics:
    get:
      tags:
      - Analytics
      operationId: getHackathonAnalytics
      summary: Registration trend, conversion rate, and demographics (organizer only)
      parameters:
      - $ref: '#/components/parameters/HackathonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    post:
      tags:
      - Notifications
      operationId: createNotification
      summary: Post an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search/users:
    get:
      tags:
      - Search
      operationId: searchUsers
      summary: Search users for team invites
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProfiles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /search/mentors:
    get:
      tags:
      - Search
      operationId: searchMentors
      summary: List mentors by skill (future)
      parameters:
      - name: skill
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMentors'
        '400':
          $ref: '#/components/responses/BadRequest'
  /payments/:
    post:
      tags:
      - Payments
      operationId: triggerPrizePayment
      summary: Trigger prize payment via a local gateway (Telebirr/CBE Birr/Chapa) (future)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
