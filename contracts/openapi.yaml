openapi: 3.0.3
info:
  title: Ethiopia Innovation Hub API
  version: 1.0.0
  description: Hackathon and innovation-challenge platform API.
paths:
  /api/v1/admin/hackathons/{id}/reactivate:
    post:
      operationId: v1_admin_hackathons_reactivate_create
      description: |-
        POST /admin/hackathons/{id}/reactivate. Not called for by an
        explicit FR-ADMIN-001 acceptance criterion -- see
        services.reactivate_hackathon's docstring for why it exists anyway.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHackathon'
          description: ''
  /api/v1/admin/hackathons/{id}/suspend:
    post:
      operationId: v1_admin_hackathons_suspend_create
      description: POST /admin/hackathons/{id}/suspend -- FR-ADMIN-001.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHackathon'
          description: ''
  /api/v1/admin/organizations/{id}/reactivate:
    post:
      operationId: v1_admin_organizations_reactivate_create
      description: POST /admin/organizations/{id}/reactivate.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
          description: ''
  /api/v1/admin/organizations/{id}/suspend:
    post:
      operationId: v1_admin_organizations_suspend_create
      description: POST /admin/organizations/{id}/suspend -- FR-ADMIN-001.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
          description: ''
  /api/v1/admin/organizations/pending:
    get:
      operationId: v1_admin_organizations_pending_list
      description: |-
        GET /admin/organizations/pending -- FR-ADMIN-001's "dashboard to
        review pending organization verifications". The decision action
        itself is organizations.OrganizationVerificationReviewView (POST
        /organizations/{id}/verification-review) -- see that view's and
        services.list_pending_organizations's docstrings for why it lives
        there and not here.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminOrganization'
          description: ''
  /api/v1/admin/search:
    get:
      operationId: v1_admin_search_retrieve
      description: GET /admin/search?q=... -- FR-ADMIN-002.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Matched against user name/email, organization name, and hackathon
          title.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSearchResult'
          description: ''
  /api/v1/admin/users/{id}/reactivate:
    post:
      operationId: v1_admin_users_reactivate_create
      description: POST /admin/users/{id}/reactivate.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
          description: ''
  /api/v1/admin/users/{id}/suspend:
    post:
      operationId: v1_admin_users_suspend_create
      description: POST /admin/users/{id}/suspend -- FR-ADMIN-001.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
          description: ''
  /api/v1/analytics/hackathons/{hackathon_id}/dashboard:
    get:
      operationId: v1_analytics_hackathons_dashboard_retrieve
      description: |-
        GET /analytics/hackathons/{hackathon_id}/dashboard -- FR-ANALYTICS-001.
        Registration count over time, team formation rate, and submission
        conversion rate for one hackathon; restricted to that hackathon's
        Organizer and to Platform Admins (services.get_registration_dashboard).
      parameters:
      - in: path
        name: hackathon_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDashboard'
          description: ''
  /api/v1/analytics/hackathons/{hackathon_id}/demographics:
    get:
      operationId: v1_analytics_hackathons_demographics_retrieve
      description: |-
        GET /analytics/hackathons/{hackathon_id}/demographics -- FR-ANALYTICS-002.
        Aggregated, anonymized breakdown of registrants by university and
        self-reported skill category; restricted the same way as the
        dashboard above. Returns `available: false` with a placeholder,
        rather than a 4xx, when the hackathon hasn't cleared BR-011's
        10-registration cohort floor (services.get_demographic_breakdown).
      parameters:
      - in: path
        name: hackathon_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemographicBreakdown'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: POST /auth/login -- FR-AUTH-002.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/oauth/{provider}/login:
    post:
      operationId: v1_auth_oauth_login_create
      description: |-
        POST /auth/oauth/{provider}/login -- FR-AUTH-005. Not yet in Doc 04;
        add it. `provider` is a URL path segment (github|google), not a body
        field -- services.oauth_login validates it against
        Account.oauth_provider's model choices, so an unsupported value 404s
        at the URL resolver rather than reaching the service layer at all.
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAuthLogin'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: v1_auth_password_reset_create
      description: POST /auth/password-reset -- FR-AUTH-004. Not yet in Doc 04; add
        it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: |-
        POST /auth/password-reset/confirm -- FR-AUTH-004. Not yet in Doc 04;
        add it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /auth/refresh -- FR-AUTH-002. Replaces SimpleJWT's stock
        TokenRefreshView: that view neither matches the contract's response
        shape nor checks token_version on the refresh token itself (see
        services.refresh_access_token's docstring).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/signup:
    post:
      operationId: v1_auth_signup_create
      description: POST /auth/signup -- FR-AUTH-001.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/verify-email:
    post:
      operationId: v1_auth_verify_email_create
      description: POST /auth/verify-email -- FR-AUTH-003. Not yet in Doc 04; add
        it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/verify-email/resend:
    post:
      operationId: v1_auth_verify_email_resend_create
      description: |-
        POST /auth/verify-email/resend -- FR-AUTH-003 (1 request / 5 min).
        Not yet in Doc 04; add it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerification'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/hackathons/:
    get:
      operationId: v1_hackathons_retrieve
      description: |-
        GET /hackathons -- FR-DISC-001/002 (public). POST /hackathons --
        FR-HACK-001 (organizer only; enforced in services.py since the target
        organization is in the request body, not the URL -- HasScopedRole
        needs a URL kwarg to resolve scope_id from, same reasoning as
        organizations.OrganizationListCreateView's POST).
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHackathons'
          description: ''
    post:
      operationId: v1_hackathons_create
      description: |-
        GET /hackathons -- FR-DISC-001/002 (public). POST /hackathons --
        FR-HACK-001 (organizer only; enforced in services.py since the target
        organization is in the request body, not the URL -- HasScopedRole
        needs a URL kwarg to resolve scope_id from, same reasoning as
        organizations.OrganizationListCreateView's POST).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HackathonCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HackathonCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HackathonCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
          description: ''
  /api/v1/hackathons/{id}:
    get:
      operationId: v1_hackathons_retrieve_2
      description: GET (public for published hackathons) / PUT / DELETE /hackathons/{id}.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
          description: ''
    put:
      operationId: v1_hackathons_update
      description: GET (public for published hackathons) / PUT / DELETE /hackathons/{id}.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HackathonUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HackathonUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HackathonUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
          description: ''
    delete:
      operationId: v1_hackathons_destroy
      description: GET (public for published hackathons) / PUT / DELETE /hackathons/{id}.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/hackathons/{id}/submissions:
    get:
      operationId: v1_hackathons_submissions_retrieve
      description: |-
        GET /hackathons/{id}/submissions -- FR-ELIG-002 bulk screening
        view. Organizer-only (enforced in services.py, default
        IsAuthenticated permission class here, same pattern as this app's
        other organizer-gated endpoints); one-click eligible/disqualify
        actions per row are PUT /submissions/{id}/eligibility, owned by
        apps.submissions per its own URL prefix -- see that app's views.py.
      parameters:
      - in: query
        name: eligibilityStatus
        schema:
          type: string
        description: 'Filter by current screening status. One of: pending, eligible,
          disqualified.'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, 1-100. Default 20.
      - in: query
        name: offset
        schema:
          type: integer
        description: Pagination offset. Default 0.
      - in: query
        name: trackId
        schema:
          type: string
        description: Filter to submissions opted into this ChallengeTrack. Must belong
          to the same hackathon.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScreeningSubmissions'
          description: ''
  /api/v1/hackathons/{id}/tracks:
    get:
      operationId: v1_hackathons_tracks_retrieve
      description: GET (public) / POST /hackathons/{id}/tracks -- FR-TRACK-001.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChallengeTracks'
          description: ''
    post:
      operationId: v1_hackathons_tracks_create
      description: GET (public) / POST /hackathons/{id}/tracks -- FR-TRACK-001.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeTrackCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChallengeTrackCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChallengeTrackCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeTrack'
          description: ''
  /api/v1/judging/assignments/{assignment_id}:
    delete:
      operationId: v1_judging_assignments_destroy
      description: |-
        DELETE /judging/assignments/{assignment_id} -- FR-JUDGE-001. Organizer
        only, and only before the round opens. If the judge already scored the
        submission, the caller must resend with confirmScoreDiscard to also
        delete those scores (services.remove_assignment).
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/judging/assignments/{assignment_id}/reassign:
    post:
      operationId: v1_judging_assignments_reassign_create
      description: |-
        POST /judging/assignments/{assignment_id}/reassign -- FR-JUDGE-001.
        Swaps the assigned judge for one who has already accepted an invitation
        to the round; Organizer only, and only before the round opens. Requires
        confirmScoreDiscard if the outgoing judge already scored the submission
        (services.reassign_judge).
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentReassign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentReassign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentReassign'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/judging/judge/invitations:
    post:
      operationId: v1_judging_judge_invitations_create
      description: |-
        POST /judging/judge/invitations -- FR-JUDGE-001. Invites an email
        address to judge a round; restricted to that round's manager, and only
        while the round is not_started (services.invite_judge).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgeInvitationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JudgeInvitationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JudgeInvitationCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeInvitation'
          description: ''
  /api/v1/judging/judge/invitations/{invitation_id}/accept:
    post:
      operationId: v1_judging_judge_invitations_accept_create
      description: |-
        POST /judging/judge/invitations/{invitation_id}/accept -- FR-JUDGE-001.
        Accepted only by the invited email's own account; grants that account
        a judge RoleAssignment on the hackathon (services.accept_invitation).
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
