# NOT active — this is a reference for re-enabling Celery later.
#
# To bring Celery back:
#   1. Uncomment the two apps in config/settings/base.py THIRD_PARTY_APPS
#   2. Uncomment the Celery block in config/settings/base.py, restore
#      CACHES to point at Redis
#   3. Uncomment celery/redis/django-celery-* in requirements/base.txt
#   4. Uncomment the celery_app import in config/__init__.py
#   5. Paste these three services (redis, worker, beat) into docker-compose.yml
#   6. docker compose up --build

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
    command: celery -A config worker -l info -Q notifications,media,analytics,scheduled
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
    # Exactly one replica — never scale this service.
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
