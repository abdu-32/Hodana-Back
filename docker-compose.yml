# Backend team's local dev stack. Nothing here depends on the frontend
# repo, and nothing in the frontend repo depends on this file.
#
# Celery + Redis are re-enabled (see config/settings/base.py) now that
# apps.notifications has periodic jobs (deadline reminders, 90-day purge)
# that need a scheduler.
#
# Usage:
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: innovation_hub
      POSTGRES_PASSWORD: innovation_hub
      POSTGRES_DB: innovation_hub
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovation_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
    command: celery -A config worker -l info -Q notifications,media,analytics,scheduled
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
    # Exactly one replica — never scale this service (see config/celery.py).
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  db_data:
