components:
  schemas:
    AdminAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          readOnly: true
        isSuspended:
          type: boolean
          readOnly: true
        isPlatformAdmin:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - email
      - fullName
      - id
      - isPlatformAdmin
      - isSuspended
    AdminHackathon:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        hostOrgId:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusDaeEnum'
        isSuspended:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - hostOrgId
      - id
      - isSuspended
      - slug
      - title
    AdminOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/TypeF58Enum'
        contactEmail:
          type: string
          format: email
          readOnly: true
        verificationStatus:
          type: string
          readOnly: true
        domainFastTracked:
          type: boolean
          readOnly: true
        isSuspended:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - contactEmail
      - createdAt
      - domainFastTracked
      - id
      - isSuspended
      - name
      - type
      - verificationStatus
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        roundId:
          type: string
          format: uuid
          readOnly: true
        submissionId:
          type: string
          format: uuid
          readOnly: true
        judgeUserId:
          type: string
          format: uuid
          readOnly: true
        assignedAt:
          type: string
          format: date-time
          readOnly: true
        reassignedFromUserId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - assignedAt
      - id
      - judgeUserId
      - reassignedFromUserId
      - roundId
      - submissionId
    AssignmentCreate:
      type: object
      properties:
        submissionId:
          type: string
          format: uuid
        judgeUserId:
          type: string
          format: uuid
      required:
      - judgeUserId
      - submissionId
    AssignmentReassign:
      type: object
      properties:
        confirmScoreDiscard:
          type: boolean
          default: false
        newJudgeUserId:
          type: string
          format: uuid
      required:
      - newJudgeUserId
    AttachMedia:
      type: object
      description: |-
        POST /submissions/{submissionId}/media -- FR-SUB-002. Replaces the
        full attachment set (the client is expected to send the complete
        desired list, same as `technologies` above), since neither FR-SUB-002
        nor Doc 04 defines an incremental add/remove contract.
      properties:
        attachmentUrls:
          type: array
          items:
            type: string
            format: uri
          maxItems: 5
      required:
      - attachmentUrls
    AuthResponse:
      type: object
      description: |-
        Output-only wrapper for signup/login/refresh -- Doc 04 AuthResponse.
        `instance` is expected to be a plain dict: {"access", "refresh", "user"}.
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
      - accessToken
      - refreshToken
      - user
    AutoDistribution:
      type: object
      properties:
        judgeUserIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - judgeUserIds
    Badge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        type:
          $ref: '#/components/schemas/BadgeTypeEnum'
        awardedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - awardedAt
      - id
      - type
      - userId
    BadgeTypeEnum:
      enum:
      - verified_student
      - hackathon_veteran
      type: string
      description: |-
        * `verified_student` - Verified Student
        * `hackathon_veteran` - Hackathon Veteran
    ChallengeTrack:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        hackathonId:
          type: string
          format: uuid
          readOnly: true
        sponsorOrgId:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        prize:
          type: string
        rubricReference:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - hackathonId
      - id
      - name
      - rubricReference
      - sponsorOrgId
    ChallengeTrackCreate:
      type: object
      properties:
        sponsorOrgId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
        prize:
          type: string
          default: ''
        rubricReference:
          type: string
          default: ''
      required:
      - name
      - sponsorOrgId
    Channel55aEnum:
      enum:
      - email
      - in_portal
      - sms
      type: string
      description: |-
        * `email` - Email
        * `in_portal` - In-Portal
        * `sms` - SMS
    CreateTeam:
      type: object
      description: POST /teams/hackathons/{hackathonId} -- FR-TEAM-001.
      properties:
        teamName:
          type: string
          maxLength: 60
          minLength: 3
      required:
      - teamName
    DemographicBreakdown:
      type: object
      description: |-
        Implements FR-ANALYTICS-002. `available=False` (with empty
        breakdown lists) is the BR-011 placeholder for a hackathon that
        hasn't yet cleared the minimum cohort size, not an error response.
      properties:
        hackathonId:
          type: string
          format: uuid
        available:
          type: boolean
        minimumCohortSize:
          type: integer
        currentCount:
          type: integer
        byUniversity:
          type: array
          items:
            $ref: '#/components/schemas/DemographicBucket'
        bySkill:
          type: array
          items:
            $ref: '#/components/schemas/DemographicBucket'
        byAgeGroup:
          type: array
          items:
            $ref: '#/components/schemas/DemographicBucket'
        byCountry:
          type: array
          items:
            $ref: '#/components/schemas/DemographicBucket'
      required:
      - available
      - byAgeGroup
      - byCountry
      - bySkill
      - byUniversity
      - currentCount
      - hackathonId
      - minimumCohortSize
    DemographicBucket:
      type: object
      description: |-
        One aggregated cohort in a FR-ANALYTICS-002 breakdown -- never
        smaller than BR-011's minimum cohort size (see
        services._bucket_with_privacy_floor).
      properties:
        label:
          type: string
        count:
          type: integer
      required:
      - count
      - label
    EligibilityStatusEnum:
      enum:
      - eligible
      - disqualified
      type: string
      description: |-
        * `eligible` - eligible
        * `disqualified` - disqualified
    EligibilityUpdate:
      type: object
      description: |-
        PUT /submissions/{submissionId}/eligibility -- FR-ELIG-001. Request
        shape only; the actual screening rules (locked precondition, reason
        length, permissions, audit logging) live in
        apps.hackathons.services.screen_submission -- see that app's ELIG
        section for why ELIG logic lives there despite this being a
        submissions-prefixed endpoint.
      properties:
        eligibilityStatus:
          $ref: '#/components/schemas/EligibilityStatusEnum'
        reason:
          type: string
          default: ''
      required:
      - eligibilityStatus
    Hackathon:
      type: object
      description: |-
        Doc 04's `Hackathon` schema declares `eligibilityRules` as a plain
        string (it's actually JSONB per DB Design) and omits
        `showcasePublishedAt`/`updatedAt`, both load-bearing here (BR-004's
        publish gate, FR-SHOWCASE-001's visibility gate). Same "flag the
